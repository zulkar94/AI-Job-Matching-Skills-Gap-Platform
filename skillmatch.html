<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skillmatch — job matching &amp; skills gap</title>
<style>
  :root{
    --bg:#10141b;
    --panel:#171d27;
    --line:#2a3342;
    --ink:#e6e9ef;
    --mute:#8993a4;
    --amber:#d9a441;
    --teal:#4fa39a;
    --red:#c4634a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
    padding:28px;
  }
  .mono{font-family:ui-monospace,Menlo,'SF Mono',Consolas,monospace;}
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:1px solid var(--line);
    padding-bottom:16px;
    margin-bottom:20px;
  }
  h1{margin:0;font-size:1.5rem;font-weight:700;letter-spacing:-0.2px;}
  .tag{color:var(--mute);font-size:0.8rem;margin-top:4px;}
  .live{
    display:flex;align-items:center;gap:6px;
    font-size:0.75rem;color:var(--teal);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px;}
  .kpi{background:var(--panel);border:1px solid var(--line);padding:16px 18px;}
  .kpi .val{font-size:1.8rem;font-weight:700;}
  .kpi .lbl{font-size:0.75rem;color:var(--mute);margin-top:2px;letter-spacing:0.3px;}

  .layout{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start;}
  @media (max-width:820px){.layout{grid-template-columns:1fr;}}

  .panel{background:var(--panel);border:1px solid var(--line);padding:18px;}
  .panel h2{font-size:0.95rem;margin:0 0 12px 0;}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .chip{
    background:#20293a;border:1px solid var(--line);
    padding:4px 9px;font-size:0.78rem;border-radius:3px;
    display:flex;align-items:center;gap:6px;
  }
  .chip .x{cursor:pointer;color:var(--mute);}
  .chip .x:hover{color:var(--red);}
  .skillform{display:flex;gap:0;border-bottom:1px solid var(--line);}
  .skillform input{
    flex:1;background:transparent;border:none;color:var(--ink);
    padding:8px 2px;font-size:0.88rem;outline:none;
  }
  .skillform button{
    background:none;border:none;color:var(--amber);
    cursor:pointer;font-size:0.8rem;
  }
  button.refresh{
    margin-top:16px;width:100%;padding:9px;
    background:transparent;border:1px solid var(--line);
    color:var(--mute);cursor:pointer;font-size:0.78rem;
  }
  button.refresh:hover{border-color:var(--amber);color:var(--amber);}

  .job{
    background:var(--panel);border:1px solid var(--line);
    padding:16px 18px;margin-bottom:12px;
  }
  .job.flash{animation:flash 1.2s ease;}
  @keyframes flash{0%{border-color:var(--amber);}100%{border-color:var(--line);}}
  .job-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .job-title{font-weight:600;font-size:1rem;}
  .job-co{color:var(--mute);font-size:0.82rem;margin-top:2px;}
  .score{text-align:right;flex-shrink:0;}
  .score .n{font-size:1.3rem;font-weight:700;}
  .score .n.low{color:var(--red);}
  .score .n.mid{color:var(--amber);}
  .score .n.high{color:var(--teal);}
  .bar{height:4px;background:#232c3a;margin:10px 0 12px 0;overflow:hidden;}
  .bar i{display:block;height:100%;background:var(--teal);}
  .row{font-size:0.78rem;color:var(--mute);margin-bottom:4px;}
  .row .skill{color:var(--ink);}
  .row .gap{color:var(--red);}
  .course{color:var(--amber);}
  .job-actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px;}
  .apply{
    background:var(--teal);color:#0c1218;border:none;
    padding:7px 16px;font-size:0.8rem;cursor:pointer;
  }
  .apply:hover{background:#5fb3a9;}
  .applied{color:var(--mute);font-size:0.78rem;}
</style>
</head>
<body>

<header>
  <div>
    <h1>Skillmatch</h1>
    <div class="tag">CV → live vacancies → skill gaps → ranked jobs → courses</div>
  </div>
  <div class="live"><span class="dot"></span><span class="mono">market live — updates every 8s</span></div>
</header>

<div class="kpis">
  <div class="kpi"><div class="val" id="kAvg">—</div><div class="lbl">AVG MATCH SCORE</div></div>
  <div class="kpi"><div class="val" id="kApps">0</div><div class="lbl">APPLICATIONS</div></div>
  <div class="kpi"><div class="val" id="kConv">0%</div><div class="lbl">INTERVIEW CONVERSION</div></div>
</div>

<div class="layout">
  <div class="panel">
    <h2>Your profile</h2>
    <div class="chips" id="skillChips"></div>
    <form class="skillform" id="skillForm">
      <input type="text" id="skillInput" placeholder="Add a skill…" autocomplete="off">
      <button type="submit">add</button>
    </form>
    <button class="refresh" id="refreshBtn">↻ simulate market shift</button>
  </div>

  <div id="jobList"></div>
</div>

<script>
let userSkills = ['JavaScript','SQL','Communication','Git'];
let applications = 0;
let interviews = 0;

let jobs = [
  { id:1, title:'Frontend Engineer', company:'Northbridge Retail', required:['JavaScript','React','CSS','Git','Testing'] },
  { id:2, title:'Data Analyst', company:'Halden & Cole', required:['SQL','Excel','Python','Communication'] },
  { id:3, title:'Product Support Lead', company:'Ferro Systems', required:['Communication','SQL','Zendesk','Stakeholder mgmt'] },
  { id:4, title:'Backend Engineer', company:'Cascade Freight', required:['Python','SQL','Docker','System design'] },
  { id:5, title:'Marketing Analyst', company:'Verity Goods', required:['Excel','Communication','SEO','A/B testing'] },
  { id:6, title:'DevOps Engineer', company:'Northbridge Retail', required:['Docker','Git','CI/CD','Linux'] },
];

const courseMap = {
  'React':'React Fundamentals — Coursera',
  'CSS':'Advanced CSS Layout — Frontend Masters',
  'Testing':'Testing JavaScript — Kent C. Dodds',
  'Excel':'Excel for Analysts — LinkedIn Learning',
  'Python':'Python for Data — DataCamp',
  'Zendesk':'Zendesk Admin Certification',
  'Stakeholder mgmt':'Stakeholder Management — edX',
  'Docker':'Docker Essentials — Udemy',
  'System design':'System Design Interview — Educative',
  'SEO':'SEO Fundamentals — Moz Academy',
  'A/B testing':'Experiment Design — Udacity',
  'CI/CD':'CI/CD Pipelines — Pluralsight',
  'Linux':'Linux Administration — LPI',
};

const skillChips = document.getElementById('skillChips');
const skillForm = document.getElementById('skillForm');
const skillInput = document.getElementById('skillInput');
const jobList = document.getElementById('jobList');
const refreshBtn = document.getElementById('refreshBtn');
const kAvg = document.getElementById('kAvg');
const kApps = document.getElementById('kApps');
const kConv = document.getElementById('kConv');

skillForm.addEventListener('submit', e => {
  e.preventDefault();
  const v = skillInput.value.trim();
  if (!v || userSkills.includes(v)) return;
  userSkills.push(v);
  skillInput.value = '';
  render();
});

function removeSkill(s){
  userSkills = userSkills.filter(x => x !== s);
  render();
}

function matchScore(job){
  const have = job.required.filter(s => userSkills.includes(s));
  return Math.round((have.length / job.required.length) * 100);
}

function gapSkills(job){
  return job.required.filter(s => !userSkills.includes(s));
}

function apply(jobId){
  applications++;
  if (Math.random() < 0.35) interviews++;
  render();
}

function scoreClass(n){
  if (n >= 70) return 'high';
  if (n >= 40) return 'mid';
  return 'low';
}

function render(flashId){
  skillChips.innerHTML = '';
  userSkills.forEach(s => {
    const c = document.createElement('div');
    c.className = 'chip';
    c.innerHTML = `<span>${s}</span><span class="x">×</span>`;
    c.querySelector('.x').addEventListener('click', () => removeSkill(s));
    skillChips.appendChild(c);
  });

  const ranked = [...jobs].sort((a,b) => matchScore(b) - matchScore(a));

  jobList.innerHTML = '';
  ranked.forEach(job => {
    const score = matchScore(job);
    const have = job.required.filter(s => userSkills.includes(s));
    const gaps = gapSkills(job);

    const div = document.createElement('div');
    div.className = 'job' + (job.id === flashId ? ' flash' : '');

    div.innerHTML = `
      <div class="job-top">
        <div>
          <div class="job-title">${job.title}</div>
          <div class="job-co">${job.company}</div>
        </div>
        <div class="score">
          <div class="n ${scoreClass(score)}">${score}%</div>
        </div>
      </div>
      <div class="bar"><i style="width:${score}%"></i></div>
      <div class="row">have: <span class="skill">${have.join(', ') || '—'}</span></div>
      <div class="row">gap: <span class="gap">${gaps.join(', ') || 'none'}</span></div>
      ${gaps.length ? `<div class="row">courses: <span class="course">${gaps.map(g => courseMap[g] || g+' — general course').join(' · ')}</span></div>` : ''}
      <div class="job-actions"></div>
    `;

    const actions = div.querySelector('.job-actions');
    const btn = document.createElement('button');
    btn.className = 'apply';
    btn.textContent = 'Apply';
    btn.addEventListener('click', () => apply(job.id));
    actions.appendChild(btn);

    jobList.appendChild(div);
  });

  const scores = jobs.map(matchScore);
  const avg = Math.round(scores.reduce((a,b) => a+b, 0) / scores.length);
  kAvg.textContent = avg + '%';
  kApps.textContent = applications;
  kConv.textContent = applications ? Math.round((interviews/applications)*100) + '%' : '0%';
}

function shiftMarket(){
  const job = jobs[Math.floor(Math.random() * jobs.length)];
  const pool = ['React','CSS','Docker','Python','SQL','Communication','Git','Excel','Linux','CI/CD','Testing','SEO'];
  const addable = pool.filter(s => !job.required.includes(s));
  if (Math.random() < 0.5 && job.required.length > 2) {
    job.required.splice(Math.floor(Math.random()*job.required.length), 1);
  } else if (addable.length) {
    job.required.push(addable[Math.floor(Math.random()*addable.length)]);
  }
  render(job.id);
}

refreshBtn.addEventListener('click', shiftMarket);
setInterval(shiftMarket, 8000);

render();
</script>
</body>
</html>
